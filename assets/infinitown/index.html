<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Galeriden 3D Infinitown</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #a5f3fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }
    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #canvas3d:active {
      cursor: grabbing;
    }

    /* Floating Building Screen Badges Container */
    #building-tags-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 4;
    }

    .building-tag {
      position: absolute;
      transform: translate(-50%, -100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
      will-change: transform, left, top;
    }
    .building-tag:hover {
      transform: translate(-50%, -115%) scale(1.08);
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }

    .tag-pill.locked {
      background: rgba(30, 41, 59, 0.92);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    .tag-pill.locked .lock-badge {
      background: #ef4444;
      color: #ffffff;
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 800;
      margin-left: 2px;
    }

    .notification-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.65);
      animation: pulseAlert 1.6s infinite ease-in-out;
      white-space: nowrap;
    }

    @keyframes pulseAlert {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
      }
      50% {
        transform: scale(1.08);
        box-shadow: 0 0 16px rgba(239, 68, 68, 0.9);
      }
    }

    /* Floating Building Hover Tooltip */
    #building-tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      transform: translate(-50%, -100%);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5), 0 0 0 1.5px rgba(255,255,255,0.12);
      white-space: nowrap;
      transition: opacity 0.15s ease;
      z-index: 10;
      min-width: 140px;
      text-align: center;
    }
    #building-tooltip::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: rgba(15, 23, 42, 0.95) transparent transparent transparent;
    }

    .tt-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tt-sub {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .tt-badge-notify {
      display: inline-block;
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .tt-status-lock {
      color: #f87171;
      font-size: 11px;
      font-weight: 700;
      background: rgba(239, 68, 68, 0.15);
      border: 1px dashed rgba(239, 68, 68, 0.35);
      padding: 4px 8px;
      border-radius: 8px;
      margin-bottom: 4px;
    }
    .tt-action {
      font-size: 10px;
      color: #38bdf8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    /* Recenter Button */
    #recenter-btn {
      position: absolute;
      top: 100px;
      right: 14px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      transition: all 0.2s ease;
      z-index: 6;
      outline: none;
    }
    #recenter-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(56, 189, 248, 0.6);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3);
    }
    #recenter-btn:active {
      transform: translateY(0);
    }

    /* Controls hint overlay */
    #controls-hint {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(255, 255, 255, 0.9);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 700;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.12);
      z-index: 5;
    }
  </style>
  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container">
    <canvas id="canvas3d"></canvas>
    <div id="building-tags-container"></div>
    <div id="building-tooltip"></div>
    <button id="recenter-btn" onclick="if(window.recenterCityView) window.recenterCityView();">
      🎯 Showroom'a Odakla
    </button>
    <div id="controls-hint">🖱️ Sol Tık / Sürükle: Şehri Kaydır · Sağ Tık: Açıyı Döndür · Tekerlek: Yakınlaş</div>
  </div>
  <script src="city_scene.js"></script>
</body>
</html>
