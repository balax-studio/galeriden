<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <script>
    // Self-healing base href calculation for GitHub Pages, root domain, or subfolders
    (function () {
      var baseTag = document.querySelector('base');
      var path = window.location.pathname;
      if (!path.endsWith('/')) {
        var lastSlash = path.lastIndexOf('/');
        path = lastSlash >= 0 ? path.substring(0, lastSlash + 1) : '/';
      }
      if (baseTag && (baseTag.getAttribute('href') === '/' || baseTag.getAttribute('href') === '$FLUTTER_BASE_HREF')) {
        baseTag.setAttribute('href', path);
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Galeriden - Otomobil Alım Satım, Ekspertiz ve Galericilik Simülasyonu">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Galeriden">
  <meta name="theme-color" content="#FFDE59">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Galeriden - Otomobil Galericilik Simülasyonu</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #0F1015;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #neo-brutal-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0F1015;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.3s ease;
      padding: 20px;
    }

    .brutal-card {
      background-color: #1A1C24;
      border: 4px solid #000000;
      box-shadow: 8px 8px 0px #FFDE59;
      padding: 28px 32px;
      max-width: 380px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .brutal-tag-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      width: 100%;
      justify-content: space-between;
    }

    .brutal-badge {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 8px;
      border: 2px solid #000000;
      color: #000000;
    }
    .badge-yellow {
      background-color: #FFDE59;
      box-shadow: 2px 2px 0px #000000;
    }
    .badge-cyan {
      background-color: #00E5FF;
      box-shadow: 2px 2px 0px #000000;
    }

    .brutal-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #FFFFFF;
      text-transform: uppercase;
      text-shadow: 3px 3px 0px #000000;
      margin-bottom: 6px;
    }

    .brutal-subtitle {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #FFDE59;
      text-transform: uppercase;
      margin-bottom: 20px;
      text-align: center;
    }

    .brutal-progress-frame {
      width: 100%;
      height: 22px;
      background: #000000;
      border: 3px solid #000000;
      box-shadow: 4px 4px 0px #000000;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }

    .brutal-progress-stripes {
      height: 100%;
      width: 120%;
      background: repeating-linear-gradient(
        -45deg,
        #FFDE59,
        #FFDE59 14px,
        #000000 14px,
        #000000 28px
      );
      animation: brutal-stripes 0.8s linear infinite;
    }

    @keyframes brutal-stripes {
      0% { transform: translateX(0); }
      100% { transform: translateX(-28px); }
    }

    .brutal-status-text {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #A0A5B8;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #00E5FF;
      border: 1px solid #000000;
      box-shadow: 1px 1px 0px #000000;
      animation: pulse-dot 1s infinite alternate;
    }

    @keyframes pulse-dot {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="neo-brutal-loader">
    <div class="brutal-card">
      <div class="brutal-tag-row">
        <span class="brutal-badge badge-cyan">SİMÜLASYON</span>
      </div>
      <div class="brutal-title">GALERİDEN</div>
      <div class="brutal-subtitle">OTO GALERİ & TİCARET</div>
      <div class="brutal-progress-frame">
        <div class="brutal-progress-stripes"></div>
      </div>
      <div class="brutal-status-text">
        <div class="status-dot"></div>
        <span>PİYASA VERİLERİ YÜKLENİYOR...</span>
      </div>
    </div>
  </div>

  <script>
    // Robust Loader Dismissal Handler
    function dismissNeoBrutalLoader() {
      var loader = document.getElementById('neo-brutal-loader');
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        loader.style.transform = 'scale(0.96)';
        loader.style.pointerEvents = 'none';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 320);
      }
    }

    // 1. Flutter standard first frame event
    window.addEventListener('flutter-first-frame', function() {
      dismissNeoBrutalLoader();
    });

    // 2. DOM Mutation Observer checking when Flutter view attaches
    var observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
        setTimeout(dismissNeoBrutalLoader, 150);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 3. Fallback safety timer: never block the user under any circumstance
    setTimeout(function() {
      dismissNeoBrutalLoader();
    }, 3800);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
