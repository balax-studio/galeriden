<!DOCTYPE html>
<html>
<head>
  <base href="/galeriden/">

  <script>
    // Self-healing base href calculation for GitHub Pages, root domain, or subfolders
    (function () {
      var baseTag = document.querySelector('base');
      var path = window.location.pathname;
      if (!path.endsWith('/')) {
        var lastSlash = path.lastIndexOf('/');
        path = lastSlash >= 0 ? path.substring(0, lastSlash + 1) : '/';
      }
      if (baseTag && (baseTag.getAttribute('href') === '/' || baseTag.getAttribute('href') === '/galeriden/')) {
        baseTag.setAttribute('href', path);
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Galeriden - Otomobil Alım Satım, Ekspertiz ve Galericilik Simülasyonu">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Galeriden">
  <meta name="theme-color" content="#0D0D0F">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Galeriden - Otomobil Galericilik Simülasyonu</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #0D0D0F;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background-color: #0D0D0F;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #1E1E24;
      border-top: 4px solid #C9A96E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    .loading-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .loading-subtitle {
      font-size: 12px;
      color: #888899;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div class="loading-title">GALERİDEN</div>
    <div class="loading-subtitle">Piyasa verileri yükleniyor...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
